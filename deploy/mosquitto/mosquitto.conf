# Pilot-scale broker config for the one-box stack. Telemetry batches are
# Ed25519-signed and replay-protected at the application layer — the transport
# is untrusted by design — but for any network beyond this box, lock the
# broker down: TLS listener, per-device credentials or mTLS, and ACLs
# restricting each device to its own proxies/telemetry/<id> topics.
listener 1883
allow_anonymous true
